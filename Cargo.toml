[package]
name = "workshop"
version = "0.1.17"
edition = "2024"
default-run = "workshop"

[features]
default = ["desktop"]
desktop = ["dep:slint", "dep:rfd", "dep:gltf", "dep:glam", "dep:windows-sys", "dep:pulldown-cmark", "dep:syntect"]

[dependencies]
anyhow = "1"
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
process-wrap = { version = "10", features = ["tokio1", "kill-on-drop"] }
tokio = { version = "1", features = ["rt", "macros", "io-util", "process", "sync", "time"] }
dunce = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility"], optional = true }
rfd = { version = "0.15", optional = true }
gltf = { version = "1.4", default-features = false, features = ["utils"], optional = true }
glam = { version = "0.30", optional = true }
pulldown-cmark = { version = "0.13", default-features = false, optional = true }
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Media_Audio"], optional = true }

[[bin]]
name = "workshop"
path = "src/desktop.rs"
required-features = ["desktop"]

[[bin]]
name = "workshop-cli"
path = "src/bin/workshop-cli.rs"

[profile.dev]
debug = 0
