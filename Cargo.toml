[package]
name = "workshop"
version = "0.1.0"
edition = "2024"
default-run = "workshop"

[features]
default = ["desktop"]
desktop = ["dep:slint", "dep:rfd"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
process-wrap = { version = "10", features = ["tokio1", "kill-on-drop"] }
tokio = { version = "1", features = ["rt", "macros", "io-util", "process", "sync", "time"] }
dunce = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility"], optional = true }
rfd = { version = "0.15", optional = true }

[[bin]]
name = "workshop"
path = "src/desktop.rs"
required-features = ["desktop"]

[[bin]]
name = "workshop-cli"
path = "src/cli.rs"

[profile.dev]
debug = 0
